name: Node.js CI

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']

jobs:
    build:
        runs-on: self-hosted

        strategy:
            matrix:
                node-version: [20.x]

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - run: npm ci --loglevel verbose
            - run: |
                  touch .env
                  echo "${{ secrets.E_CLASS }}" > .env
                  cat .env # Debugging step to check .env content
            - run: npm run build --if-present
            - run: npm install pm2 -g
            - run: pm2 restart api